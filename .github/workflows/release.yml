name: Release

on:
  push:
    branches: [main]
    paths:
      - "VERSION"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Get version
        id: version
        run: |
          VERSION=$(cat VERSION)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag exists
        id: check_tag
        run: |
          if git rev-parse "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Extract changelog
        if: steps.check_tag.outputs.exists == 'false'
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          # Extract changelog section for this version
          CHANGELOG=$(awk "/## \[$VERSION\]/{flag=1; next} /## \[/{flag=0} flag" CHANGELOG.md)
          # Handle multi-line output
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Amazon Order History CSV Download MCP ${{ steps.version.outputs.tag }}

            ${{ steps.changelog.outputs.changelog }}

            ### Installation

            ```bash
            npm install --global amz-order-history-csv-mcp
            npx playwright install chromium
            ```

            See [README.md](https://github.com/marcusquinn/amazon-order-history-csv-download-mcp#readme) for full setup instructions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Release Summary
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          echo "## Release Created" >> $GITHUB_STEP_SUMMARY
          echo "- Version: ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- [View Release](https://github.com/marcusquinn/amazon-order-history-csv-download-mcp/releases/tag/${{ steps.version.outputs.tag }})" >> $GITHUB_STEP_SUMMARY

      - name: Skip Release
        if: steps.check_tag.outputs.exists == 'true'
        run: |
          echo "## Release Skipped" >> $GITHUB_STEP_SUMMARY
          echo "Tag ${{ steps.version.outputs.tag }} already exists" >> $GITHUB_STEP_SUMMARY

  publish-npm:
    name: Publish npm package
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          registry-url: "https://registry.npmjs.org"

      - name: Use trusted-publishing-compatible npm
        run: npm install --global npm@11.17.0 --ignore-scripts

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify release candidate
        run: |
          npm run lint
          npm run typecheck
          npm test
          npm run build

      - name: Verify tag and package metadata
        id: package
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          VERSION=$(node --print "require('./package.json').version")
          PACKAGE_NAME=$(node --print "require('./package.json').name")
          FILE_VERSION=$(tr -d '\r\n' < VERSION)
          TAG="v${VERSION}"

          test "$VERSION" = "$FILE_VERSION"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          TAG_SHA=$(git rev-list -n 1 "$TAG")
          test "$TAG_SHA" = "$RELEASE_SHA"

          echo "name=$PACKAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Pack release artifact
        id: artifact
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          PACK_OUTPUT=$(npm pack --json)
          node -e 'const value = JSON.parse(process.argv[1])[0]; const allowed = value.files.length > 0 && value.files.every(file => ["LICENSE", "README.md", "package.json"].includes(file.path) || file.path.startsWith("dist/")); if (value.name !== process.argv[2] || value.version !== process.argv[3] || !value.filename || !value.integrity || !value.shasum || !allowed) process.exit(1)' "$PACK_OUTPUT" "$PACKAGE_NAME" "$PACKAGE_VERSION"

          PACKAGE_FILE=$(node -e 'const value = JSON.parse(process.argv[1])[0]; process.stdout.write(value.filename)' "$PACK_OUTPUT")
          PACKAGE_INTEGRITY=$(node -e 'const value = JSON.parse(process.argv[1])[0]; process.stdout.write(value.integrity)' "$PACK_OUTPUT")
          PACKAGE_SHASUM=$(node -e 'const value = JSON.parse(process.argv[1])[0]; process.stdout.write(value.shasum)' "$PACK_OUTPUT")

          test -f "$PACKAGE_FILE"
          echo "filename=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"
          echo "integrity=$PACKAGE_INTEGRITY" >> "$GITHUB_OUTPUT"
          echo "shasum=$PACKAGE_SHASUM" >> "$GITHUB_OUTPUT"

      - name: Check registry version
        id: registry
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
          LOCAL_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          LOCAL_SHASUM: ${{ steps.artifact.outputs.shasum }}
        run: |
          set +e
          REGISTRY_OUTPUT=$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version gitHead dist --json 2>&1)
          REGISTRY_STATUS=$?
          set -e

          if [ "$REGISTRY_STATUS" -eq 0 ]; then
            REGISTRY_VERSION=$(node -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.version || "")' "$REGISTRY_OUTPUT")
            REGISTRY_GIT_HEAD=$(node -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.gitHead || "")' "$REGISTRY_OUTPUT")
            REGISTRY_INTEGRITY=$(node -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.dist?.integrity || "")' "$REGISTRY_OUTPUT")
            REGISTRY_SHASUM=$(node -e 'const value = JSON.parse(process.argv[1]); process.stdout.write(value.dist?.shasum || "")' "$REGISTRY_OUTPUT")
            test "$REGISTRY_VERSION" = "$PACKAGE_VERSION"
            test "$REGISTRY_INTEGRITY" = "$LOCAL_INTEGRITY"
            test "$REGISTRY_SHASUM" = "$LOCAL_SHASUM"
            # npm may omit gitHead; when present, it must still bind to the release commit.
            if [ -n "$REGISTRY_GIT_HEAD" ]; then
              test "$REGISTRY_GIT_HEAD" = "$RELEASE_SHA"
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$REGISTRY_OUTPUT" | grep -q 'E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' "$REGISTRY_OUTPUT" >&2
            exit "$REGISTRY_STATUS"
          fi

      - name: Publish package
        if: steps.registry.outputs.exists == 'false'
        env:
          PACKAGE_FILE: ${{ steps.artifact.outputs.filename }}
        run: npm publish "$PACKAGE_FILE"

      - name: Publication summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package.outputs.version }}
          PACKAGE_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          VERSION_EXISTS: ${{ steps.registry.outputs.exists }}
        run: |
          echo "## npm publication" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: ${PACKAGE_NAME}@${PACKAGE_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Integrity: ${PACKAGE_INTEGRITY}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Already published: ${VERSION_EXISTS}" >> "$GITHUB_STEP_SUMMARY"
